<!DOCTYPE html>
<html>
<head>
<title>Fellipe quer brincar</title>

<style>

body{
text-align:center;
font-family:Arial;
margin-top:100px;
transition: background-color 1s;
overflow:hidden;
}

.pixel{
position:absolute;
font-family:monospace;
font-size:20px;
font-weight:bold;
pointer-events:none;
}

</style>

</head>

<body>

<h1>Site do Fellipe 😈</h1>

<button onclick="brincar()" style="background:red;color:white;font-size:25px;padding:20px;border:none;border-radius:10px;">
Fellipe quer brincar
</button>

<p id="texto" style="display:none;font-size:25px;margin-top:20px;">
Fellipe quer brincar com o benjamin...
</p>

<audio id="voz">
<source src="voz.mp3" type="audio/mpeg">
</audio>

<script>

let cores = ["#ffcccc","#ffd6ff","#ccffcc","#cce0ff","#ffffcc"];
let i = 0;

function brincar(){

document.getElementById("texto").style.display="block";
document.getElementById("voz").play();

piscarFundo();
chuvaPixels();

}

function piscarFundo(){

setInterval(function(){

document.body.style.backgroundColor = cores[i];
i++;

if(i >= cores.length){
i = 0;
}

},1000);

}

function chuvaPixels(){

setInterval(function(){

let caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
let letra = caracteres[Math.floor(Math.random()*caracteres.length)];

let span = document.createElement("span");
span.className="pixel";
span.innerText=letra;

span.style.left=Math.random()*window.innerWidth+"px";
span.style.top=Math.random()*window.innerHeight+"px";

let cores=["red","blue","green","yellow","pink","white"];
span.style.color=cores[Math.floor(Math.random()*cores.length)];

document.body.appendChild(span);

setTimeout(function(){
span.remove();
},300);

},50);

}

</script>

</body>
</html>
