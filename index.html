<!DOCTYPE html>
<html>

<head>
<title>Fellipe Quer Brincar</title>

<style>

body{
background:black;
color:white;
text-align:center;
font-family:Arial;
}

h1{
margin-top:40px;
}

img{
width:300px;
margin-top:30px;
}

button{
margin-top:30px;
padding:20px 40px;
font-size:22px;
background:red;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

#mensagem{
display:none;
font-size:28px;
margin-top:20px;
color:red;
}

</style>

</head>

<body>

<h1>Fellipe Quer Brincar</h1>

<img id="foto" src="https://i.imgur.com/9XnKQYH.png">

<br>

<button onclick="brincar()">Fellipe quer brincar</button>

<p id="mensagem">
Fellipe quer brincar com o Benjamin...
</p>

<audio id="som">
<source src="https://www.myinstants.com/media/sounds/movie_1.mp3">
</audio>

<script>

function brincar(){

document.getElementById("mensagem").style.display="block";

setTimeout(function(){

document.body.style.background="darkred";

document.getElementById("foto").src="https://i.imgur.com/9XnKQYH.png";

document.getElementById("som").play();

},3000);

}

</script>

</body>
</html>
